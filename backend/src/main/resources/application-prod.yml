# ── Production Profile ────────────────────────────────────────────────────
# Active when: spring.profiles.active=prod
# Purpose: Production-hardened overrides
# All secrets come from environment variables. Never hardcode here.

spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: WARN
    com.align.qms: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.flywaydb: INFO

management:
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized

server:
  # Require HTTPS-enforced deployments to handle TLS at the reverse proxy
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
