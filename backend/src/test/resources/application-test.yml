# ── Test Profile ──────────────────────────────────────────────────────────
# Active when: @ActiveProfiles("test")
# Purpose: Testcontainers-backed PostgreSQL integration tests
# DataSource URL/username/password are injected by @DynamicPropertySource
# in PostgresIntegrationTest base class.

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  datasource:
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 150
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

logging:
  level:
    root: WARN
    com.align.qms: INFO
    org.flywaydb: INFO
    org.testcontainers: INFO
    org.springframework.security: WARN

management:
  endpoint:
    health:
      show-details: always

# ── Test JWT & CORS ──────────────────────────────────────────────────────
# Fixed test secret (64+ chars for HS512 security). Never used in production.
align:
  jwt:
    secret: test-secret-key-for-align-integration-tests-minimum-64-characters-long-ALIGN
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  cors:
    allowed-origins: http://localhost:5173
